
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AR Studio | Creator Dashboard</title>

<script type="module"
src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
</script>

<style>
:root {
  --blue: #DCEFFF;
  --lilac: #DCCBFF;
  --lavender: #A78BFA;
  --purple: #7455BB;
  --white: #FFFFFF;
  --background: #F8FBFF;
  --text: #302B50;
  --muted: #77758F;
  --border: #DDD9F1;
  --danger: #A53654;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(
    135deg,
    #F8FBFF 0%,
    #EAF5FF 45%,
    #F3ECFF 100%
  );
  color: var(--text);
}

header {
  padding: 20px 5%;
  background: rgba(255,255,255,0.88);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.logo {
  font-size: 24px;
  font-weight: 800;
  color: var(--purple);
}

header span {
  font-size: 12px;
  color: var(--muted);
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 35px 5%;
}

h1 {
  font-size: clamp(28px, 5vw, 42px);
  margin-bottom: 10px;
}

h2, h3 {
  color: var(--text);
}

p {
  color: var(--muted);
  line-height: 1.6;
}

.hero {
  margin-bottom: 30px;
}

.eyebrow {
  color: var(--purple);
  font-weight: bold;
  font-size: 12px;
  letter-spacing: 1px;
}

.stats {
  display: grid;
  grid-template-columns:
    repeat(auto-fit, minmax(180px, 1fr));
  gap: 18px;
  margin: 25px 0;
}

.stat {
  border-radius: 18px;
  padding: 24px;
  border: 1px solid #C5DFF7;
  background: var(--blue);
}

.stat:nth-child(2) {
  background: #F0E8FF;
  border-color: #DDD0FA;
}

.stat:nth-child(3) {
  background: #E5E0FF;
  border-color: #D5C9FA;
}

.stat p {
  margin: 0;
  color: #665C82;
  font-size: 14px;
}

.stat h2 {
  font-size: 38px;
  margin: 12px 0 0;
  color: #51447D;
}

button {
  background: var(--lavender);
  color: white;
  border: none;
  border-radius: 10px;
  padding: 12px 18px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  transition: .2s;
