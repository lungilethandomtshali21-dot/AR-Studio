
<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>AR Studio | Camera</title>

  <!-- 3D rendering framework -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- Image tracking engine -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
    }

    #guide {
      position: fixed;
      z-index: 20;
      top: 12px;
      left: 12px;
      right: 12px;
      background: #0b1220df;
      color: white;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      pointer-events: none;
    }

    #back {
      position: fixed;
      z-index: 21;
      bottom: 20px;
      left: 20px;
      background: #e9b95d;
      color: #111827;
      padding: 12px 16px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div id="guide">
    Point your camera at the sample target card.
    Allow camera access when prompted.
  </div>

  <a id="back" href="index.html">
    ← Home
  </a>

  <a-scene
    mindar-image="imageTargetSrc: https://raw.githubusercontent.com/hiukim/mind-ar-js/master/examples/image-tracking/assets/card-example/card.mind; autoStart: true;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
  >

    <a-assets></a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity
      mindar-image-target="targetIndex: 0">

      <!-- Animated AR overlay -->
      <a-plane
        color="#e9b95d"
        opacity="0.85"
        position="0 0 0.05"
        height="0.55"
        width="0.9"
        animation="property: rotation; to: 0 0 360; loop: true; dur: 8000; easing: linear">
      </a-plane>

      <!-- AR text -->
      <a-text
        value="AR STUDIO"
        color="#0b1220"
        align="center"
        width="2.2"
        position="0 0 0.08">
      </a-text>

    </a-entity>

  </a-scene>

  <script>
    const guide = document.querySelector('#guide');

    const target = document.querySelector(
      '[mindar-image-target]'
    );

    target.addEventListener('targetFound', () => {
      guide.textContent =
        'Target found! Your AR overlay is active.';
    });

    target.addEventListener('targetLost', () => {
      guide.textContent =
        'Target lost — point your camera back at the card.';
    });
  </script>

</body>
</html>
